# Settings for Pages CMS (pagescms.org): the editing screens staff use after logging in.
media:
- name: images
  label: Photos and pictures
  input: src/images
  output: /images
  categories:
  - image
- name: files
  label: Documents (PDFs)
  input: src/files
  output: /files
  extensions:
  - pdf
  - doc
  - docx
  - xls
  - xlsx
content:
- name: home_letter
  label: 'HOME PAGE: Letter from the director'
  type: file
  path: src/index.md
  format: yaml-frontmatter
  fields:
  - name: body
    label: Director's letter
    type: rich-text
- name: home
  label: 'HOME PAGE: Headline, buttons, picture, sections and side boxes'
  type: file
  path: src/_data/home.json
  format: json
  fields:
  - name: hero
    label: Top of the page
    type: object
    fields:
    - name: title
      label: Big headline
      type: string
    - name: lead
      label: Intro under the headline
      type: text
    - name: image
      label: Picture on the right (leave empty for no picture)
      type: image
      options:
        media: images
    - name: imageAlt
      label: Describe the picture for people who cannot see it
      type: string
    - name: buttons
      label: Buttons under the intro (first one is the bright button)
      type: object
      fields:
      - name: label
        label: Button words
        type: string
      - name: url
        label: Where it goes (like /addressing/)
        type: string
      list: true
  - name: letterHeading
    label: Heading above the director's letter
    type: string
  - name: services
    label: What we do section
    type: object
    fields:
    - name: heading
      label: Heading
      type: string
    - name: text
      label: Paragraph
      type: text
    - name: cards
      label: Cards (the boxes under What we do)
      type: object
      fields:
      - name: title
        label: Card title
        type: string
      - name: text
        label: Card text
        type: text
      - name: link
        label: Where the link goes (a page address like /addressing/ or a full web address)
        type: string
      - name: linkText
        label: Link words
        type: string
      list: true
  - name: glance
    label: At a glance numbers
    type: object
    fields:
    - name: heading
      label: Heading
      type: string
    - name: items
      label: Numbers
      type: object
      fields:
      - name: label
        label: Label
        type: string
      - name: value
        label: Number or words
        type: string
      list: true
    - name: linkText
      label: Link words under the numbers
      type: string
    - name: linkUrl
      label: Where that link goes (empty to hide it)
      type: string
  - name: resource
    label: Resource request section
    type: object
    fields:
    - name: show
      label: Show this section?
      type: boolean
    - name: heading
      label: Heading
      type: string
    - name: text
      label: Paragraph
      type: text
    - name: formUrl
      label: Online form link (optional)
      type: string
    - name: formLabel
      label: Online form button words
      type: string
    - name: pdf
      label: PDF form (optional)
      type: file
      options:
        media: files
    - name: pdfLabel
      label: PDF button words
      type: string
  - name: sidebar
    label: Boxes on the right side
    type: object
    fields:
    - name: phonesHeading
      label: Phone box heading
      type: string
    - name: numbers
      label: Numbers in the phone box
      type: object
      fields:
      - name: label
        label: Label
        type: string
      - name: number
        label: Phone number
        type: string
      list: true
    - name: phonesLinkText
      label: Link words under the phone box
      type: string
    - name: boardHeading
      label: Board meetings box heading
      type: string
    - name: boardLinkText
      label: Board meetings link words
      type: string
    - name: visitHeading
      label: Visit or write box heading
      type: string
    - name: directionsLinkText
      label: Directions link words
      type: string
    - name: facebookHeading
      label: Facebook box heading
      type: string
    - name: facebookLinkText
      label: Facebook link words
      type: string
    - name: linksHeading
      label: Helpful links box heading
      type: string
    - name: linksLinkText
      label: Helpful links link words
      type: string
- name: notice
  label: 'HOME PAGE: Public notice (red/yellow banner)'
  type: file
  path: src/_data/notice.json
  format: json
  fields:
  - name: show
    label: Show this notice?
    type: boolean
  - name: title
    label: Title
    type: string
  - name: text
    label: Message
    type: text
- name: about
  label: 'PAGE: About the EOC'
  type: file
  path: src/about.md
  format: yaml-frontmatter
  fields:
  - name: title
    label: Page title (big heading at the top)
    type: string
  - name: subtitle
    label: Short line under the title (optional)
    type: string
  - name: heroImage
    label: Big picture at the top of the page (optional)
    type: image
    options:
      media: images
  - name: heroAlt
    label: Describe that picture for people who cannot see it
    type: string
  - name: form
    label: Form button (optional)
    type: object
    fields:
    - name: label
      label: Button text, like Request a tour
      type: string
    - name: url
      label: Link to the online form (paste the Google Forms link). Leave empty to show the call message instead.
      type: string
    - name: help
      label: Message shown when there is no form link yet, like To arrange a tour, please call
      type: string
    - name: phone
      label: Phone number shown after that message (leave empty to use the main phone number)
      type: string
  - name: body
    label: Page text (edit like a normal document; use the picture button to add or swap photos)
    type: rich-text
- name: addressing
  label: 'PAGE: Addressing, street signs and alarm monitoring'
  type: file
  path: src/addressing.md
  format: yaml-frontmatter
  fields:
  - name: title
    label: Page title (big heading at the top)
    type: string
  - name: subtitle
    label: Short line under the title (optional)
    type: string
  - name: heroImage
    label: Big picture at the top of the page (optional)
    type: image
    options:
      media: images
  - name: heroAlt
    label: Describe that picture for people who cannot see it
    type: string
  - name: form
    label: Form button (optional)
    type: object
    fields:
    - name: label
      label: Button text, like Request a tour
      type: string
    - name: url
      label: Link to the online form (paste the Google Forms link). Leave empty to show the call message instead.
      type: string
    - name: help
      label: Message shown when there is no form link yet, like To arrange a tour, please call
      type: string
    - name: phone
      label: Phone number shown after that message (leave empty to use the main phone number)
      type: string
  - name: body
    label: Page text (edit like a normal document; use the picture button to add or swap photos)
    type: rich-text
- name: telecommunicators
  label: 'PAGE: Dispatch (Behind the Call)'
