- name: lepc_chart
  label: 'PAGE: LEPC fire and HazMat chart'
  type: file
  path: src/_data/lepc.json
  format: json
  fields:
  - name: title
    label: Heading above the chart
    type: string
  - name: intro
    label: Paragraphs above the chart (leave a blank line between paragraphs)
    type: text
  - name: items
    label: Call types and counts (the chart draws itself)
    type: object
    fields:
    - name: name
      label: Call type
      type: string
    - name: count
      label: Number of calls
      type: number
    list: true
- name: community
